<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입·로그인</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="site" style="font-family:'Noto Sans KR',sans-serif;color:#13302A;background:#F6FBF8">

<dc-import name="Header" active="none" logged-in="{{ no }}" hint-size="100%,77px"></dc-import>

<section class="wrap" style="padding-top:48px;padding-bottom:72px;display:flex;flex-direction:column;align-items:center;gap:28px">
<div style="text-align:center;max-width:560px">
<h1 class="t1" style="font-size:clamp(28px,3.2vw,38px)">{{ title }}</h1>
<p class="lead" style="margin-top:10px">{{ sub }}</p>
</div>

<div class="card" style="width:100%;max-width:520px;border-radius:20px;display:flex;flex-direction:column;gap:22px;box-shadow:0 12px 32px rgba(11,90,68,0.08)">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E6F4EC;border-radius:14px;padding:6px" role="group" aria-label="로그인 또는 회원가입">
<button type="button" class="{{ loginTab }}" aria-pressed="{{ isLogin }}" onClick="{{ toLogin }}">로그인</button>
<button type="button" class="{{ signupTab }}" aria-pressed="{{ isSignup }}" onClick="{{ toSignup }}">회원가입</button>
</div>

<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ true }}">
<form style="display:flex;flex-direction:column;gap:18px">
<div class="field"><label for="s-email">이메일</label><input class="input" id="s-email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com"><p class="help">인증 메일과 결과 안내를 받을 주소입니다.</p></div>
<div class="field"><label for="s-pw">비밀번호</label><input class="input" id="s-pw" type="password" autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상"></div>
<div class="field"><label for="s-pw2">비밀번호 확인</label><input class="input" id="s-pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력해 주세요"></div>
<div style="border:1px solid #D5E8DF;border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px">
<label class="check" style="font-weight:700;border-bottom:1px solid #D5E8DF;padding-bottom:10px;margin-bottom:6px"><input type="checkbox">약관 전체 동의</label>
<label class="check"><input type="checkbox"><span>[필수] 만 14세 이상입니다</span></label>
<label class="check"><input type="checkbox"><span>[필수] 이용약관 동의 <a href="#">보기</a></span></label>
<label class="check"><input type="checkbox"><span>[필수] 개인정보 수집·이용 동의 <a href="#">보기</a></span></label>
<label class="check"><input type="checkbox"><span>[선택] 오픈·할인 소식 이메일 받기</span></label>
</div>
<button type="button" class="btn btn-p btn-lg btn-block">가입하고 인증 메일 받기</button>
<p class="help" style="text-align:center">메일의 인증 버튼을 누르면 가입이 끝납니다. 메일이 안 보이면 스팸함을 확인해 주세요.</p>
</form>
</sc-if>

<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
<form style="display:flex;flex-direction:column;gap:18px">
<div class="field"><label for="l-email">이메일</label><input class="input" id="l-email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com"></div>
<div class="field"><label for="l-pw">비밀번호</label><input class="input" id="l-pw" type="password" autocomplete="current-password"></div>
<button type="button" class="btn btn-p btn-lg btn-block">로그인</button>
<button type="button" class="btn btn-g btn-block" onClick="{{ toReset }}">비밀번호를 잊으셨나요?</button>
</form>
</sc-if>

<sc-if value="{{ isReset }}" hint-placeholder-val="{{ false }}">
<form style="display:flex;flex-direction:column;gap:18px">
<p style="margin:0;color:#2F4740">가입한 이메일을 넣으시면 비밀번호를 새로 정하는 링크를 보내 드립니다.</p>
<div class="field"><label for="r-email">가입한 이메일</label><input class="input" id="r-email" type="email" inputmode="email" autocomplete="email" placeholder="example@email.com"></div>
<button type="button" class="btn btn-p btn-lg btn-block">재설정 메일 보내기</button>
<button type="button" class="btn btn-g btn-block" onClick="{{ toLogin }}">로그인으로 돌아가기</button>
</form>
</sc-if>

<div style="display:flex;align-items:center;gap:12px;color:#53675F;font-size:15px"><span style="flex:1;height:1px;background:#D5E8DF"></span>또는<span style="flex:1;height:1px;background:#D5E8DF"></span></div>
<button type="button" class="btn btn-block btn-dis" disabled>카카오로 시작하기 (준비 중)</button>
</div>

<div class="grid" style="width:100%;max-width:880px">
<div class="card-tint" style="display:flex;gap:14px;align-items:flex-start;padding:20px"><span class="num">1</span><div><strong>내 사주 저장</strong><p class="muted small" style="margin:2px 0 0">매번 생년월일을 다시 넣지 않아도 됩니다.</p></div></div>
<div class="card-tint" style="display:flex;gap:14px;align-items:flex-start;padding:20px"><span class="num">2</span><div><strong>오늘의 사업운 무료</strong><p class="muted small" style="margin:2px 0 0">가입 후에도 매일 무료로 봅니다.</p></div></div>
<div class="card-tint" style="display:flex;gap:14px;align-items:flex-start;padding:20px"><span class="num">3</span><div><strong>신청 내역 한곳에</strong><p class="muted small" style="margin:2px 0 0">진행 상태와 결과를 마이페이지에서 확인합니다.</p></div></div>
</div>
</section>

<dc-import name="Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startMode":{"editor":"enum","options":["signup","login","reset"],"default":"signup"},"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state && this.state.mode) || this.props.startMode || 'signup';
    const tabOn = 'btn btn-p';
    const tabOff = 'btn';
    const titles = {
      signup: ['무료 회원가입', '가입하면 내 사주를 저장하고 신청 내역을 한곳에서 볼 수 있습니다.'],
      login: ['다시 오셨네요', '가입한 이메일로 로그인해 주세요.'],
      reset: ['비밀번호 찾기', '가입한 이메일로 재설정 링크를 보내 드립니다.']
    };
    return {
      no: false,
      isSignup: mode === 'signup',
      isLogin: mode === 'login',
      isReset: mode === 'reset',
      loginTab: mode === 'signup' ? tabOff : tabOn,
      signupTab: mode === 'signup' ? tabOn : tabOff,
      title: titles[mode][0],
      sub: titles[mode][1],
      toLogin: () => this.setState({ mode: 'login' }),
      toSignup: () => this.setState({ mode: 'signup' }),
      toReset: () => this.setState({ mode: 'reset' })
    };
  }
}
</script>
</body>
</html>
