<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 헤더</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header class="site hdr" style="font-family:'Noto Sans KR',sans-serif;color:#13302A">
<div class="wrap hdr-in">
<a class="logo" href="Main.dc.html" aria-label="사장님 운세 홈">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#0B7A5A"/><circle cx="17" cy="17" r="7.5" fill="none" stroke="#FFD84D" stroke-width="2.2"/><circle cx="17" cy="17" r="2.4" fill="#FFD84D"/></svg>
<span class="logo-name">사장님 운세</span>
<span class="badge badge-line" style="font-size:12px;padding:0 8px;font-weight:500">가칭</span>
</a>
<nav class="hdr-nav" aria-label="주요 메뉴">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="4">
<a class="{{ item.cls }}" href="{{ item.href }}">{{ item.label }}</a>
</sc-for>
</nav>
<div class="hdr-act">
<sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
<a class="btn btn-o" href="My.dc.html">내 신청</a>
</sc-if>
<sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}">
<a class="btn btn-p" href="Login.dc.html">로그인·가입</a>
</sc-if>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["none","today","report","date","name"],"default":"none"},"loggedIn":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'none';
    const loggedIn = this.props.loggedIn ?? false;
    const items = [
      { key: 'today', label: '오늘의 운세', href: 'Main.dc.html#today' },
      { key: 'report', label: '신년 사업운', href: 'Detail.dc.html' },
      { key: 'date', label: '개업택일', href: 'Date.dc.html' },
      { key: 'name', label: '작명', href: 'Name.dc.html' }
    ];
    return {
      nav: items.map((i) => ({ ...i, cls: i.key === active ? 'nav-a on' : 'nav-a' })),
      loggedIn: loggedIn,
      loggedOut: !loggedIn
    };
  }
}
</script>
</body>
</html>
